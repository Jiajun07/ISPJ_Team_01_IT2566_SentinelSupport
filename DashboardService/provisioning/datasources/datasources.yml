apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    basicAuth: false
    withCredentials: false
    editable: true
    jsonData:
      httpMethod: GET
      queryTimeout: 60s
      timeInterval: 30s
    secureJsonData: {}

  - name: SentinelSupport-HTTP
    type: grafana-simple-json-datasource
    access: proxy
    url: http://host.docker.internal:5000
    isDefault: false
    basicAuth: false
    withCredentials: false
    editable: true
    jsonData:
      httpMethod: GET
      queryTimeout: 30s
    secureJsonData: {}