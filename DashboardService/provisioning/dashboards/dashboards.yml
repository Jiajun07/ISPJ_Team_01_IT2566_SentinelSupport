apiVersion: 1

providers:
  - name: 'SentinelSupport Dashboards'
    orgId: 1
    folder: 'SentinelSupport'
    folderUid: 'sentinelsupport'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/DashboardService/provisioning/dashboards