{% extends "base.html" %}
{% block content %}

<script>
    document.body.classList.add("myfiles-body");
</script>

<div class="confirm-shell">
    <aside class="side-rail">
        <button type="button" class="upload-btn" onclick="window.location.href='/myfiles'">Upload File</button>

        <nav class="rail-nav">
            <button class="rail-link active" type="button" onclick="window.location.href='/myfiles'">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
                My files
            </button>
            <button class="rail-link" type="button">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                </svg>
                Shared with me
            </button>
            <button class="rail-link" type="button">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                Recent
            </button>
            <button class="rail-link" type="button">
                <svg class="rail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                </svg>
                Bin
            </button>
        </nav>
    </aside>

    <section class="main-stage">
        <div class="confirm-workspace">
            <div class="confirm-body">

                <div id="dlp-status-container" style="margin-bottom: 20px; display: none;">
                    <div id="dlp-status-alert" style="padding: 15px; border-radius: 6px; display: flex; align-items: center; gap: 15px;">
                        <div id="dlp-icon" style="font-size: 24px;"></div>
                        <div>
                            <strong id="dlp-title" style="display: block; margin-bottom: 4px;"></strong>
                            <span id="dlp-message" style="font-size: 0.9em;"></span>
                        </div>
                    </div>
                </div>

                <div class="confirm-preview">
                    <div class="confirm-file-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                    <div class="confirm-meta">
                        <div class="meta-row"><span class="meta-label">Name of file:</span><span class="meta-value">{{ file.name }}</span></div>
                        <div class="meta-row"><span class="meta-label">Sensitivity:</span><span class="meta-value" id="sensitivity-display">(scanning...)</span></div>
                        <div class="meta-row"><span class="meta-label">Owner:</span><span class="meta-value">{{ file.owner }}</span></div>
                        <div class="meta-row"><span class="meta-label">Date Uploaded:</span><span class="meta-value">{{ file.modified }}</span></div>
                        <div class="meta-row" style="font-size: 0.85rem; color: #999;">
                            <span class="meta-label">Risk Score:</span>
                            <span class="meta-value" id="risk-score-display">-</span>
                        </div>
                    </div>
                </div>

                <form class="confirm-form" method="POST">
                    <input type="hidden" name="tenant" value="{{ request.args.get('tenant', '1') }}">
                    <input type="hidden" name="risk_type" id="risk-type-field" value="">
                    {% if is_version %}
                    <input type="hidden" name="original_filename" value="{{ original_filename }}">
                    {% endif %}

                    <div class="form-grid">
                        <label class="form-field">
                            <span class="field-label">File name</span>
                            <input type="text" name="name" value="{{ file.name }}" required>
                        </label>
                        <label class="form-field">
                            <span class="field-label">Sensitivity</span>
                            <input type="text" name="sensitivity" id="sensitivity-input" placeholder="e.g., Public / Internal / Confidential">
                        </label>
                        <label class="form-field">
                            <span class="field-label">Owner</span>
                            <input type="text" name="owner" value="{{ file.owner }}">
                        </label>
                        <label class="form-field">
                            <span class="field-label">Notes</span>
                            <input type="text" name="notes" placeholder="Optional notes">
                        </label>

                        <div id="justification-container" style="display: none; grid-column: 1 / -1; margin-top: 10px;">
                            <label class="form-field" style="width: 100%;">
                                <span class="field-label" style="color: #f57c00; font-weight: bold;">⚠️ Business Justification Required</span>
                                <textarea name="justification" id="justification-input" rows="3"
                                    placeholder="Please explain why you are uploading this sensitive document..."
                                    style="width: 100%; padding: 10px; border: 1px solid #f57c00; border-radius: 4px;"></textarea>
                            </label>
                        </div>
                    </div>

                    <div class="confirm-actions">
                        <button type="submit" id="confirm-btn" class="primary-btn">Confirm Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</div>

<script>
    // Get temp_id and tenant from page
    const tempId = "{{ file.temp_id }}";
    const currentTenant = "{{ request.args.get('tenant', '1') }}";
    const confirmBtn = document.getElementById('confirm-btn');
    const justificationContainer = document.getElementById('justification-container');
    const justificationInput = document.getElementById('justification-input');
    const statusContainer = document.getElementById('dlp-status-container');
    const statusAlert = document.getElementById('dlp-status-alert');
    const statusIcon = document.getElementById('dlp-icon');
    const statusTitle = document.getElementById('dlp-title');
    const statusMessage = document.getElementById('dlp-message');

    // Scan file with DLP on page load
    document.addEventListener('DOMContentLoaded', async () => {
        // Disable button while scanning
        confirmBtn.disabled = true;
        confirmBtn.innerText = "Scanning...";
        await scanFileWithDLP();
    });

    async function scanFileWithDLP() {
        try {
            const response = await fetch(`/scan/dlp/${tempId}?tenant=${currentTenant}`);
            const data = await response.json();

            if (data.success) {
                updateMetaData(data);
                handleDlpEnforcement(data);
            } else {
                showStatus("Error", "Error scanning file", "#f44336", "#ffebee", "❌");
                confirmBtn.disabled = false;
                confirmBtn.innerText = "Confirm Upload";
            }
        } catch (error) {
            console.error('DLP scanning error:', error);
            showStatus("Error", "Connection failed", "#f44336", "#ffebee", "❌");
            confirmBtn.disabled = false;
            confirmBtn.innerText = "Confirm Upload";
        }
    }

    function updateMetaData(data) {
        // Update display with sensitivity and risk info
        document.getElementById('sensitivity-display').textContent = data.sensitivity;
        document.getElementById('sensitivity-input').value = data.sensitivity;
        document.getElementById('risk-score-display').textContent = `${data.riskScore}% (${data.riskLevel})`;
        document.getElementById('risk-type-field').value = data.riskLevel;

        // Apply visual styling based on risk level
        const sensitivityDisplay = document.getElementById('sensitivity-display');
        sensitivityDisplay.style.fontWeight = '600';

        const riskColors = {
            'Restricted': '#d32f2f',
            'Confidential': '#f57c00',
            'Internal': '#fbc02d',
            'Public': '#388e3c'
        };

        sensitivityDisplay.style.color = riskColors[data.sensitivity] || '#333';
        const riskScoreDisplay = document.getElementById('risk-score-display');
        riskScoreDisplay.style.color = riskColors[data.sensitivity] || '#999';
    }

    function handleDlpEnforcement(data) {
        const action = data.action; // BLOCK, JUSTIFY, WARN, MONITOR

        // Default state
        confirmBtn.disabled = false;
        confirmBtn.innerText = "Confirm Upload";
        justificationContainer.style.display = 'none';

        switch (action) {
            case "BLOCK":
                showStatus("Upload Blocked", data.message, "#721c24", "#f8d7da", "⛔");
                confirmBtn.disabled = true;
                confirmBtn.innerText = "Upload Blocked by Policy";
                confirmBtn.style.backgroundColor = "#6c757d";
                confirmBtn.style.cursor = "not-allowed";
                break;

            case "JUSTIFY":
                showStatus("Justification Required", data.message, "#856404", "#fff3cd", "⚠️");
                // Enable Justification Logic
                justificationContainer.style.display = 'block';
                justificationInput.required = true;
                confirmBtn.disabled = true; // Disabled until typed

                justificationInput.addEventListener('input', function() {
                    if (this.value.trim().length > 0) {
                        confirmBtn.disabled = false;
                    } else {
                        confirmBtn.disabled = true;
                    }
                });
                break;

            case "WARN":
                showStatus("Warning", data.message, "#856404", "#fff3cd", "🛡️");
                break;

            case "MONITOR":
            default:
                // Optional: Show success message or hide completely
                // showStatus("Scan Complete", data.message, "#155724", "#d4edda", "✅");
                statusContainer.style.display = 'none';
                break;
        }
    }

    function showStatus(title, message, color, bgColor, icon) {
        statusContainer.style.display = 'block';
        statusAlert.style.backgroundColor = bgColor;
        statusAlert.style.color = color;
        statusAlert.style.border = `1px solid ${color}`;
        statusTitle.textContent = title;
        statusMessage.textContent = message;
        statusIcon.textContent = icon;
    }
</script>

{% endblock %}
