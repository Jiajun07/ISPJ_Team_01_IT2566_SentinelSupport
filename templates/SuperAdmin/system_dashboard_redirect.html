<!DOCTYPE html>
<html>
<head>
    <title>Redirecting to Dashboard...</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }
        .container { text-align: center; }
        .spinner { 
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #3498db; 
            border-radius: 50%; 
            width: 50px; 
            height: 50px; 
            animation: spin 1s linear infinite; 
            margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { 
            display: inline-block; 
            padding: 10px 20px; 
            margin: 10px; 
            background: #4dabf7; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            transition: all 0.3s; 
        }
        .btn:hover { background: #339af0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛡️ SentinelSupport System Dashboard</h2>
        <div class="spinner"></div>
        <p>Opening Grafana monitoring dashboard...</p>
        
        <div>
            <a href="http://localhost:3000" target="_blank" class="btn">
                🔗 Open Grafana Dashboard
            </a>
            <a href="{{ url_for('superadmincontrolpanel') }}" class="btn">
                ← Back to Control Panel
            </a>
        </div>
    </div>
    
    <script>
        // Open Grafana in new tab
        window.open('http://localhost:3000', '_blank');
        
        // Redirect back to control panel after 3 seconds
        setTimeout(function() {
            window.location.href = '{{ url_for("superadmincontrolpanel") }}';
        }, 3000);
    </script>
</body>
</html>
